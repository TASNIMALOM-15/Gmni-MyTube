name: Build MyTube Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Debug APK (armeabi-v7a & arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      - name: Verify APK Architecture (32-bit armeabi-v7a & 64-bit arm64-v8a)
        run: |
          echo "Checking built APKs..."
          find app/build/outputs/apk/ -name "*.apk" -ls

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyTube-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
